name: 🚀 CD - Deploy Infrastructure & Services

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar clave SSH en el Runner
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Aplicar Infraestructura con Terraform
        env:
          TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: "${{ secrets.PROXMOX_API_TOKEN_ID }}=${{ secrets.PROXMOX_API_TOKEN_SECRET }}"
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      - name: Aprovisionar Servicios con Ansible
        run: |
          cd ansible
          ansible-playbook -i inventory.ini site.yml