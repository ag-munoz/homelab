---
# 0. Esperar a que se enciendan los contenedores
- name: Esperar a que los contenedores estén listos por SSH
  hosts: all
  gather_facts: false # Desactivado para que no intente conectar antes de tiempo
  tasks:
    - name: Esperar a que SSH acepte conexiones
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 60
        connect_timeout: 5

# 1. Configuración base e instalación de Docker en todas las LXC
- name: Preparar entorno base y runtime de contenedores
  hosts: lxc_containers
  become: true
  roles:
    - common
    - docker

# 2. Despliegue de la pila del Reverse Proxy en la LXC de Proxy
- name: Aprovisionar servicios de red y proxy
  hosts: proxy_nodes
  become: true
  roles:
    - proxy

# 3. Despliegue de la pila de aplicaciones en la LXC Multimedia
- name: Aprovisionar servicios multimedia
  hosts: media_nodes
  become: true
  roles:
    - media

# 4. Despliegue del runner de GitHub
- name: Aprovisionar runner
  hosts: runner_nodes
  become: true
  roles:
    - runner
