networks:
  traefik-net:
    name: traefik-net

services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=lolosofevil@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/proxy/traefik/:/traefik
      - /opt/proxy/traefik/dynamic:/etc/traefik/dynamic
    networks:
      - traefik-net

  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    environment:
      - PORT=7575
      - HOSTNAME=0.0.0.0
    ports:
      - "7575:7575"
    volumes:
      - /opt/proxy/homarr/configs:/app/data/configs
      - /opt/proxy/homarr/icons:/app/public/icons
      - /opt/proxy/homarr/data:/data
    restart: unless-stopped
    networks:
      - traefik-net
