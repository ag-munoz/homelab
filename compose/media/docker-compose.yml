services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "8096:8096"
    volumes:
      - /opt/media/jellyfin/config:/config
      - /mnt/storage/media:/data/media
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "8989:8989"
    volumes:
      - /opt/media/sonarr/config:/config
      - /mnt/storage/media:/data/media
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "7878:7878"
    volumes:
      - /opt/media/radarr/config:/config
      - /mnt/storage/media:/data/media
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "6767:6767"
    volumes:
      - /opt/media/bazarr/config:/config
      - /mnt/storage/media:/data/media
    restart: unless-stopped