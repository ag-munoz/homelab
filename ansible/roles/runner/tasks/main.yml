---
- name: Limpiar repositorio de HashiCorp corrupto si existe
  file:
    path: /etc/apt/sources.list.d/hashicorp.list
    state: absent

- name: Descargar clave GPG oficial de HashiCorp
  get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /usr/share/keyrings/hashicorp-archive-keyring.gpg
    mode: '0644'

- name: Añadir repositorio oficial de HashiCorp (Terraform)
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
    state: present
    filename: hashicorp

- name: Instalar dependencias completas en el runner
  apt:
    name:
      - curl
      - wget
      - git
      - tar
      - python3
      - python3-pip
      - ansible
      - terraform
      - docker.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Crear usuario runner y añadirlo al grupo docker
  user:
    name: runner
    groups: docker
    append: yes

- name: Asegurar directorio .ssh en usuario runner
  file:
    path: /home/runner/.ssh
    state: directory
    owner: runner
    group: runner
    mode: '0700'

- name: Copiar clave SSH privada para que el runner pueda gestionar los LXC
  copy:
    src: ~/.ssh/id_ed25519
    dest: /home/runner/.ssh/id_ed25519
    owner: runner
    group: runner
    mode: '0600'

- name: Limpiar y recrear directorio del agente de GitHub
  file:
    path: /actions-runner
    state: "{{ item }}"
    owner: runner
    group: runner
  loop:
    - absent
    - directory

- name: Descargar agente de GitHub Actions (v2.329.0)
  unarchive:
    src: "https://github.com/actions/runner/releases/download/v2.329.0/actions-runner-linux-x64-2.329.0.tar.gz"
    dest: /actions-runner
    remote_src: yes
    owner: runner
    group: runner

- name: Configurar y vincular el runner con GitHub
  command: >
    ./config.sh --url https://github.com/ag-munoz/homelab
    --token {{ github_runner_token }}
    --unattended
    --replace
  args:
    chdir: /actions-runner
  become: yes
  become_user: runner

- name: Instalar servicio systemd del runner
  command: ./svc.sh install runner
  args:
    chdir: /actions-runner

- name: Iniciar servicio del runner
  command: ./svc.sh start
  args:
    chdir: /actions-runner