name: Homelab CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      ansible: ${{ steps.filter.outputs.ansible }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Detectar carpetas modificadas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
            ansible:
              - 'ansible/**'
              - 'compose/**'

  deploy-terraform:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.terraform == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform CLI
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar y Aplicar Terraform
        working-directory: ./terraform
        env:
          TF_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          TF_VAR_admin_ip: ${{ secrets.ADMIN_IP }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          terraform init
          terraform apply -auto-approve

  deploy-ansible:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ansible == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Agente SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Instalar Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Ejecutar Playbook de Ansible
        working-directory: ./ansible
        run: |
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook -i inventory.ini site.yml -e "github_pat=${{ secrets.GH_PAT }}"